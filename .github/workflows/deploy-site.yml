# Publica o site dos GDDs (pasta site/) no GitHub Pages a cada push na main.
# Pré-requisito, uma vez só: Settings → Pages → Source: "GitHub Actions".

name: Deploy do site dos GDDs

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'site/**'
      - 'prototipos/**'
      - 'Sprites/StarExpeditionCo/**'
      - 'Sprites/8-Bit-Armageddon/**'
      - 'Sprites/PaddockBoss/**'
      - 'Sprites/Rally2D/**'
      - 'Sprites/RequiemOfBlessings/**'
      - 'Sprites/PaperFlight/**'
      - 'Sprites/CraftDice/**'
      - 'Sprites/EvilEnemyDefense/**'
      - 'Sprites/GuerreiroDaMasmorra/**'
      - 'Sprites/DiceAndBlood/**'
      - 'Sprites/ProtocoloEctoplasma/**'
      - 'Sprites/NavigationExpert/**'
      - 'Sprites/RaceLegenda/**'
      - 'Sprites/StreetLegends/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # Protótipos jogáveis em /gdd/prototipos/<jogo>/. Eles carregam a arte por "../../Sprites/<Jogo>/",
      # então a pasta Sprites vai junto, na mesma posição relativa (sem candidatos descartados nem ferramentas).
      - name: Copia os protótipos e a arte deles para o site
        run: |
          cp -r ../prototipos build/prototipos
          mkdir -p build/Sprites
          cp -r ../Sprites/StarExpeditionCo ../Sprites/8-Bit-Armageddon ../Sprites/PaddockBoss ../Sprites/Rally2D ../Sprites/RequiemOfBlessings ../Sprites/PaperFlight ../Sprites/CraftDice ../Sprites/EvilEnemyDefense ../Sprites/GuerreiroDaMasmorra ../Sprites/DiceAndBlood ../Sprites/ProtocoloEctoplasma ../Sprites/NavigationExpert ../Sprites/RaceLegenda ../Sprites/StreetLegends build/Sprites/
          find build/Sprites -type d \( -name _candidatos_descartados -o -name tools -o -name _tools -o -name _previews -o -name _preview -o -name _referencia -o -name _style-test -o -name example -o -name _raw -o -name _seam \) -prune -exec rm -rf {} +
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
