# Publica o site dos GDDs (pasta site/) no GitHub Pages a cada push na main.
# Pré-requisito, uma vez só: Settings → Pages → Source: "GitHub Actions".

name: Deploy do site dos GDDs

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'site/**'
      - 'prototipos/**'
      - 'Sprites/StarExpeditionCo/**'
      - 'Sprites/8-Bit-Armageddon/**'
      - 'Sprites/8-Bit-Armageddon-Iso/**'
      - 'Sprites/PaddockBoss/**'
      - 'Sprites/Rally2D/**'
      - 'Sprites/RequiemOfBlessings/**'
      - 'Sprites/PaperFlight/**'
      - 'Sprites/CraftDice/**'
      - 'Sprites/CacaAsBruxas/**'
      - 'Sprites/EvilEnemyDefense/**'
      - 'Sprites/GuerreiroDaMasmorra/**'
      - 'Sprites/GuerreiroDaMasmorraV2/**'
      - 'Sprites/GuerreiroDaMasmorraV2-3D/**'
      - 'Sprites/GuerreiroDaMasmorraApp/**'
      - 'Sprites/GuerreiroDaMasmorraApp-3D/**'
      - 'Sprites/DiceAndBlood/**'
      - 'Sprites/ProtocoloEctoplasma/**'
      - 'Sprites/NavigationExpert/**'
      - 'Sprites/RaceLegenda/**'
      - 'Sprites/StreetLegends/**'
      - 'Sprites/UltimaEntrega/**'
      - 'Sprites/FuryHauler/**'
      - 'Sprites/SpaceHauler/**'
      - 'Sprites/SeaHauler/**'
      - 'Sprites/IsoRpg/**'
      - 'Sprites/IsoRpg3D/**'
      - 'Sprites/IsoCards/**'
      - 'Sprites/OldKnightWitch/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # Protótipos jogáveis em /gdd/prototipos/<jogo>/. Eles carregam a arte por "../../Sprites/<Jogo>/",
      # então a pasta Sprites vai junto, na mesma posição relativa (sem candidatos descartados nem ferramentas).
      - name: Copia os protótipos e a arte deles para o site
        run: |
          cp -r ../prototipos build/prototipos
          mkdir -p build/Sprites
          cp -r ../Sprites/StarExpeditionCo ../Sprites/8-Bit-Armageddon ../Sprites/8-Bit-Armageddon-Iso ../Sprites/PaddockBoss ../Sprites/Rally2D ../Sprites/RequiemOfBlessings ../Sprites/PaperFlight ../Sprites/CraftDice ../Sprites/CacaAsBruxas ../Sprites/EvilEnemyDefense ../Sprites/GuerreiroDaMasmorra ../Sprites/GuerreiroDaMasmorraV2 ../Sprites/GuerreiroDaMasmorraV2-3D ../Sprites/GuerreiroDaMasmorraApp ../Sprites/GuerreiroDaMasmorraApp-3D ../Sprites/DiceAndBlood ../Sprites/ProtocoloEctoplasma ../Sprites/NavigationExpert ../Sprites/RaceLegenda ../Sprites/StreetLegends ../Sprites/UltimaEntrega ../Sprites/FuryHauler ../Sprites/SpaceHauler ../Sprites/SeaHauler ../Sprites/IsoRpg ../Sprites/IsoRpg3D ../Sprites/IsoCards ../Sprites/OldKnightWitch build/Sprites/
          find build/Sprites -type d \( -name _candidatos_descartados -o -name tools -o -name _tools -o -name _previews -o -name _preview -o -name _referencia -o -name _style-test -o -name example -o -name _raw -o -name _seam \) -prune -exec rm -rf {} +
      # Marble Arena é o único protótipo com build (Vite + TypeScript): o site recebe o dist/ dele
      # no lugar do código-fonte copiado acima. Os testes rodam antes; se falharem, nada é publicado.
      - name: Build do protótipo Marble Arena
        working-directory: prototipos/marble-arena
        run: |
          npm ci
          npm test
          npm run build
          rm -rf ../../site/build/prototipos/marble-arena
          cp -r dist ../../site/build/prototipos/marble-arena
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
